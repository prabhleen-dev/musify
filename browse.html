<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneBox - Explore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
      <div class="logo">🎵 TuneBox</div>
      <ul class="nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="browse.html" class="active">Browse</a></li>
          <li><a href="playlist.html">Your Library</a></li>
          <li><a href="search.html">Search</a></li>
      </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
      <header>
          <h1>Explore Genres</h1>
      </header>

      <div class="playlist-cards">
          <div class="card">
              <img src="images/album1.jpg" alt="Pop">
              <h3>Pop Hits</h3>
              <p>Top Pop Artists</p>
          </div>
          <div class="card">
              <img src="images/album2.jpg" alt="Rock">
              <h3>Rock Classics</h3>
              <p>All-time Rock</p>
          </div>
          <div class="card">
              <img src="images/album3.jpg" alt="Hip-Hop">
              <h3>Hip-Hop</h3>
              <p>Urban Vibes</p>
          </div>
      </div>
  </div>

  <!-- Player Bar -->
  <div class="player-bar">
      <img src="images/album1.jpg" alt="Now Playing" class="song-img">
      <div class="song-info">
          <h4>Cherry Beats</h4>
          <p>Various Artists</p>
      </div>
      <div class="player-controls">
          <button onclick="prevSong()">⏮</button>
          <button onclick="playPause()">▶️</button>
          <button onclick="nextSong()">⏭</button>
      </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
