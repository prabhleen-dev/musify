<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musify | Genres</title>
    <link rel="stylesheet" href="css/genre.css">
    <link rel="icon" type="image/png" href="images/album1.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">🎧 Musify</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="playlist.html">Playlists</a></li>
                <li><a href="album.html">Albums</a></li>
                <li><a href="artist.html">Artists</a></li>
                <li><a href="genre.html">Genres</a></li>
            </ul>
        </nav>
    </header>

    <!-- GENRES HERO -->
    <section class="genre-hero">
        <h1>Discover Music by Genre</h1>
        <p>Explore your favorite styles and vibes</p>
    </section>

    <!-- GENRES SECTION -->
    <section class="genre-section">
        <h2>Genres</h2>
        <div class="genre-container">
            <div class="genre-card" onclick="playGenre('Pop')">
                <img src="images/genre_pop.jpg" alt="Pop">
                <p>Pop</p>
            </div>
            <div class="genre-card" onclick="playGenre('Rock')">
                <img src="images/genre_rock.jpg" alt="Rock">
                <p>Rock</p>
            </div>
            <div class="genre-card" onclick="playGenre('Jazz')">
                <img src="images/genre_jazz.jpg" alt="Jazz">
                <p>Jazz</p>
            </div>
            <div class="genre-card" onclick="playGenre('Hip Hop')">
                <img src="images/genre_hiphop.jpg" alt="Hip Hop">
                <p>Hip Hop</p>
            </div>
            <!-- Add more genres here -->
        </div>
    </section>

    <!-- PLAYER FOOTER -->
    <footer class="player">
        <div class="track-info">
            <img src="images/album1.jpg" alt="Current Song" id="current-album-art">
            <div>
                <h4 id="current-song">Song Title</h4>
                <p id="current-artist">Artist</p>
            </div>
        </div>

        <div class="player-controls">
            <button id="prev"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-pause"><i class="fa-solid fa-play"></i></button>
            <button id="next"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="progress-container">
            <input type="range" id="progress-bar" value="0">
        </div>

        <audio id="audio-player" src="audio/audio1.mp3"></audio>
    </footer>

    <script src="js/genre.js"></script>
</body>
</html>
